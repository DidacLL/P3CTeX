name: Pre-TFG baseline verification
on:
  pull_request:
    paths:
      - "tex/**"
      - "examples/**"
      - ".github/workflows/pre-tfg-baseline.yml"
  workflow_dispatch:

jobs:
  class-config-regression:
    name: Class defaults, module options and bibliography (TeX Live)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out this PR or branch without external actions
        shell: bash
        run: |
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_REF}"
          git checkout -q --detach FETCH_HEAD
      - name: Compile core and configuration regression suite
        shell: bash
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work \
            ghcr.io/xu-cheng/texlive-debian:latest \
            bash /work/tex/tests/run-full-ci-once.sh core

  library-regression:
    name: Library regression / ${{ matrix.suite }} (TeX Live)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [integration, diagrams, listings, pmcalc, docs]
    steps:
      - name: Check out this PR or branch without external actions
        shell: bash
        run: |
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_REF}"
          git checkout -q --detach FETCH_HEAD
      - name: Compile selected module and document suite
        shell: bash
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work \
            ghcr.io/xu-cheng/texlive-debian:latest \
            bash /work/tex/tests/run-full-ci-once.sh "${{ matrix.suite }}"

  source-loading:
    name: Source loading / original examples / options (TeX Live)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out this PR or branch without external actions
        shell: bash
        run: |
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_REF}"
          git checkout -q --detach FETCH_HEAD
      - name: Compile unchanged sources
        shell: bash
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work/tex/tests \
            -e TEXINPUTS=".:/work/tex/latex//:/work/tex/code//:" \
            ghcr.io/xu-cheng/texlive-debian:latest bash -euc '
              kpsewhich P3CTeX.cls
              kpsewhich pxSRC.code.tex
              cd /work/examples/UOCTemplates/MinimalTemplate/PAC1
              pdflatex -halt-on-error -interaction=nonstopmode MinimalTemplatePAC.tex
              bibtex MinimalTemplatePAC
              test -s MinimalTemplatePAC.bbl
              pdflatex -halt-on-error -interaction=nonstopmode MinimalTemplatePAC.tex
              pdflatex -halt-on-error -interaction=nonstopmode MinimalTemplatePAC.tex
              test -s MinimalTemplatePAC.pdf
              cd /work/examples/UOCTemplates/ExtendedTemplate/PAC1
              pdflatex -halt-on-error -interaction=nonstopmode ExtendedTemplatePAC.tex
              bibtex ExtendedTemplatePAC
              test -s ExtendedTemplatePAC.bbl
              pdflatex -halt-on-error -interaction=nonstopmode ExtendedTemplatePAC.tex
              pdflatex -halt-on-error -interaction=nonstopmode ExtendedTemplatePAC.tex
              test -s ExtendedTemplatePAC.pdf
              mkdir -p /work/tex/tests/baseline-matrix
              cd /work/tex/tests/baseline-matrix
              for language in cat es en; do
                for config in cover,toc no-cover,toc no-cover,no-toc; do
                  filename="baseline_${language}_${config//,/_}.tex"
                  printf "%s\n" "\\documentclass[$language,$config,default]{P3CTeX}" "\\begin{document}" "\\section{Baseline}" "Language $language, configuration $config." "\\end{document}" > "$filename"
                  pdflatex -halt-on-error -interaction=nonstopmode "$filename"
                  test -s "${filename%.tex}.pdf" 
                done
              done
              for module in PRP UML SRC TAB LST; do
                filename="module_$module.tex"
                printf "%s\n" "\\documentclass[cat,$module]{P3CTeX}" "\\begin{document}" "\\section{Module selection}" "$module" "\\end{document}" > "$filename"
                pdflatex -halt-on-error -interaction=nonstopmode "$filename"
              done
            '
  miktex-install:
    name: Actual MiKTeX registered-root loading
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out this PR or branch without external actions
        shell: bash
        run: |
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_REF}"
          git checkout -q --detach FETCH_HEAD
      - name: Install MiKTeX
        run: choco install miktex --yes --no-progress
        shell: pwsh
      - name: Verify installed sources and compile
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:GITHUB_WORKSPACE
          $paths = @("$env:ProgramFiles\MiKTeX\miktex\bin\x64", "$env:LOCALAPPDATA\Programs\MiKTeX\miktex\bin\x64")
          $bin = $paths | Where-Object { Test-Path (Join-Path $_ 'initexmf.exe') } | Select-Object -First 1
          if (-not $bin) { throw 'MiKTeX installation not found' }
          & (Join-Path $bin 'initexmf.exe') --register-root="$root"
          if ($LASTEXITCODE -ne 0) { throw 'MiKTeX root registration failed' }
          & (Join-Path $bin 'initexmf.exe') --set-config-value="[MPM]AutoInstall=1"
          & (Join-Path $bin 'initexmf.exe') --update-fndb
          if ($LASTEXITCODE -ne 0) { throw 'MiKTeX FNDB refresh failed' }
          Remove-Item Env:TEXINPUTS -ErrorAction SilentlyContinue
          $class = & (Join-Path $bin 'kpsewhich.exe') P3CTeX.cls
          $code = & (Join-Path $bin 'kpsewhich.exe') pxSRC.code.tex
          Write-Output "MiKTeX class lookup: $class"
          Write-Output "MiKTeX internal lookup: $code"
          if (-not $class -or -not $code) { throw 'MiKTeX registered-root lookup failed' }
          $dir = Join-Path $root 'tex\tests'
          $filename = 'pre-tfg-miktex-original.tex'
          $lines = @('\documentclass[cat,no-cover,toc,default]{P3CTeX}', '\begin{document}', '\section{Original baseline}', 'Installed MiKTeX root.', '\end{document}')
          Set-Content -Path (Join-Path $dir $filename) -Value ($lines -join [Environment]::NewLine)
          Push-Location $dir
          try {
            & (Join-Path $bin 'pdflatex.exe') --enable-installer -halt-on-error -interaction=nonstopmode $filename
            if ($LASTEXITCODE -ne 0) { throw 'MiKTeX compilation failed' }
            if (-not (Test-Path 'pre-tfg-miktex-original.pdf')) { throw 'MiKTeX PDF not created' }
            Write-Output 'PASS: MiKTeX installed root / original source loading'
          } finally {
            Pop-Location
          }
