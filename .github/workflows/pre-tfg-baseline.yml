name: Pre-TFG baseline verification
on:
  pull_request:
    paths:
      - "tex/**"
      - "examples/**"
      - ".github/workflows/pre-tfg-baseline.yml"
  workflow_dispatch:

jobs:
  class-config-regression:
    name: Class defaults, module options and bibliography (TeX Live)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Compile core and configuration regression suite
        shell: bash
        run: echo 'Core job started'

  source-loading:
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Source stub'
  miktex-install:
    runs-on: windows-latest
    steps:
      - run: Write-Output 'MiKTeX stub'
        shell: pwsh
