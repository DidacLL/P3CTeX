name: Pre-TFG baseline verification
on:
  pull_request:
    paths:
      - "tex/**"
      - "examples/**"
      - ".github/workflows/pre-tfg-baseline.yml"
  workflow_dispatch:
jobs:
  class-config-regression:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Core starts"
  source-loading:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Source loading starts"
  miktex-install:
    runs-on: windows-latest
    steps:
      - run: Write-Output "MiKTeX starts"
        shell: pwsh
