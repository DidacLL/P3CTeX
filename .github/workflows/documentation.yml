name: Documentation CI

on:
  push:
    paths:
      - 'tex/doc/*.tex'
      - 'tex/latex/*.sty'
      - 'tex/latex/P3CTeX.cls'
      - 'tex/code/*.code.tex'
      - '.github/workflows/documentation.yml'
  pull_request:
    paths:
      - 'tex/doc/*.tex'
      - 'tex/latex/*.sty'
      - 'tex/latex/P3CTeX.cls'
      - 'tex/code/*.code.tex'
      - '.github/workflows/documentation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Get repository revision
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Select affected documentation and compile
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import subprocess

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          event_name = os.environ["GITHUB_EVENT_NAME"]
          event = json.loads(pathlib.Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          targets = set()

          if event_name == "workflow_dispatch":
              targets.update(("tex/doc/pxMEM.tex", "tex/doc/pxTFG.tex"))
          else:
              if event_name == "pull_request":
                  base = event["pull_request"]["base"]["sha"]
              else:
                  base = event.get("before", "")

              if not base or set(base) == {"0"}:
                  base = "HEAD^"
              if base != "HEAD^":
                  subprocess.run(["git", "fetch", "--no-tags", "origin", base],
                                 stdout=subprocess.DEVNULL, check=False)
                  if subprocess.run(["git", "cat-file", "-e", base + "^{commit}"],
                                    stdout=subprocess.DEVNULL,
                                    stderr=subprocess.DEVNULL).returncode:
                      base = "HEAD^"

              changed = git("diff", "--name-only", base, "HEAD").splitlines()
              for path in changed:
                  if path.startswith("tex/doc/") and path.endswith(".tex"):
                      targets.add(path)
                  elif path.startswith("tex/latex/") and path.endswith(".sty"):
                      name = pathlib.Path(path).stem
                      targets.add("tex/doc/" + name + ".tex")
                  elif path.startswith("tex/code/") and path.endswith(".code.tex"):
                      name = pathlib.Path(path).name.removesuffix(".code.tex")
                      targets.add("tex/doc/" + name + ".tex")
                  if path in {".github/workflows/documentation.yml",
                              "tex/latex/P3CTeX.cls",
                              "tex/code/P3CTeX.code.tex",
                              "tex/latex/pxCORE.sty",
                              "tex/code/pxCORE.code.tex"}:
                      targets.update(("tex/doc/pxMEM.tex", "tex/doc/pxTFG.tex"))

          selected = sorted(p for p in targets if pathlib.Path(p).is_file())
          print("Manuals to compile:", selected, flush=True)
          pathlib.Path(".documentation-targets").write_text(
              "".join(p.removeprefix("tex/") + "\n" for p in selected)
          )
          PY

          if [[ ! -s .documentation-targets ]]; then
            echo "No affected manuals; nothing to build."
            exit 0
          fi

          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work/tex \
            -e TEXINPUTS=".:/work/tex/latex//:/work/tex/code//:" \
            ghcr.io/xu-cheng/texlive-debian:latest \
            bash -euo pipefail -c '
              while IFS= read -r source; do
                echo "::group::Documentation: $source"
                latexmk -pdf -file-line-error -halt-on-error -interaction=nonstopmode "$source"
                echo "::endgroup::"
              done < /work/.documentation-targets
            '

      - name: Upload only the PDFs compiled by this run
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s .documentation-targets ]]; then
            echo "No generated documentation to upload."
            exit 0
          fi

          # Use the official artifact client directly. Marketplace actions
          # cannot start in this repository's current Actions configuration.
          npm install --prefix "${RUNNER_TEMP}/pxdoc-artifacts" \
            --no-save --ignore-scripts --silent @actions/artifact@2.3.2

          node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const { DefaultArtifactClient } = require(
            path.join(process.env.RUNNER_TEMP, 'pxdoc-artifacts/node_modules/@actions/artifact')
          )

          const root = path.join(process.env.GITHUB_WORKSPACE, 'tex')
          const sources = fs.readFileSync('.documentation-targets', 'utf8')
            .split(/\r?\n/).filter(Boolean)
          const files = sources.map(source => {
            const filename = path.basename(source, '.tex') + '.pdf'
            const file = path.join(root, filename)
            if (!fs.existsSync(file)) throw new Error('Missing compiled PDF: ' + file)
            return file
          })

          new DefaultArtifactClient().uploadArtifact(
            'documentation-pdfs', files, root, { retentionDays: 14 }
          ).then(({ id }) => {
            console.log('Uploaded ' + files.length + ' selected PDF(s); artifact ID: ' + id)
          }).catch(error => {
            console.error(error)
            process.exitCode = 1
          })
          NODE
