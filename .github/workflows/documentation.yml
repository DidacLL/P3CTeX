name: Documentation CI

on:
  push:
    paths:
      - 'tex/doc/*.tex'
      - 'tex/latex/*.sty'
      - 'tex/code/*.code.tex'
      - '.github/workflows/documentation.yml'
  pull_request:
    paths:
      - 'tex/doc/*.tex'
      - 'tex/latex/*.sty'
      - 'tex/code/*.code.tex'
      - '.github/workflows/documentation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and comparison history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select affected manuals
        id: select
        shell: bash
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          declare -A roots=()

          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            roots["doc/pxMEM.tex"]=1
            roots["doc/pxTFG.tex"]=1
          else
            if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
              base="$PR_BASE"
            else
              base="$PUSH_BEFORE"
            fi
            if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}"; then
              base="$(git rev-parse HEAD^)"
            fi

            while IFS= read -r file; do
              case "$file" in
                tex/doc/*.tex)
                  [[ -f "$file" ]] && roots["${file#tex/}"]=1
                  ;;
                tex/latex/*.sty)
                  name="${file##*/}"
                  name="${name%.sty}"
                  [[ -f "tex/doc/$name.tex" ]] && roots["doc/$name.tex"]=1
                  ;;
                tex/code/*.code.tex)
                  name="${file##*/}"
                  name="${name%.code.tex}"
                  [[ -f "tex/doc/$name.tex" ]] && roots["doc/$name.tex"]=1
                  ;;
                .github/workflows/documentation.yml)
                  # Bootstrap/check the current manuals when changing the CI itself.
                  roots["doc/pxMEM.tex"]=1
                  roots["doc/pxTFG.tex"]=1
                  ;;
              esac
            done < <(git diff --name-only "$base" HEAD)
          fi

          {
            echo 'roots<<EOF'
            if (( ${#roots[@]} )); then
              printf '%s\n' "${!roots[@]}" | sort
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Compile selected manuals
        if: steps.select.outputs.roots != ''
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: tex
          root_file: ${{ steps.select.outputs.roots }}
        env:
          TEXINPUTS: '.:./latex//:./code//:'

      - name: Collect only the PDFs built in this run
        if: steps.select.outputs.roots != ''
        shell: bash
        env:
          ROOTS: ${{ steps.select.outputs.roots }}
        run: |
          set -euo pipefail
          mkdir -p documentation-artifacts
          while IFS= read -r source; do
            [[ -z "$source" ]] && continue
            name="${source##*/}"
            name="${name%.tex}"
            cp "tex/$name.pdf" "documentation-artifacts/$name.pdf"
          done <<< "$ROOTS"

      - name: Upload compiled manuals
        if: steps.select.outputs.roots != ''
        uses: actions/upload-artifact@v4
        with:
          name: documentation-pdfs
          path: documentation-artifacts/*.pdf
          if-no-files-found: error
          retention-days: 14
