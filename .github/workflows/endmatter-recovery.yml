name: Endmatter recovery matrix
on:
  push:
    branches: [recovery/endmatter-2026-11-02]
  workflow_dispatch:
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Compile multipass PAC PR MEM and glossary documents
        shell: bash
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work/tex/tests \
            -e TEXINPUTS=".:/work/tex/latex//:/work/tex/code//:" \
            ghcr.io/xu-cheng/texlive-debian:latest bash -euc '
              tests="pxANN.automatic.test pxANN.bibliography-integration.test pxGLS.automatic.test pxGLS.entries.test pxGLS.test pxEND.PAC.test pxEND.PR.test pxEND.MEM.test pxEND.manual-all.test pxEND.bibtex.test pxEND.biblatex.test pxGLS.external.test"
              for name in $tests; do
                for pass in 1 2 3; do
                  pdflatex -halt-on-error -interaction=nonstopmode "$name.tex" > "$name.pass$pass.log" 2>&1 || { tail -n 100 "$name.pass$pass.log"; exit 1; }
                done
                test -s "$name.pdf"
                pdftotext "$name.pdf" "$name.txt"
                if grep -Ei "destination with the same identifier|multiply-defined" "$name.pass3.log"; then exit 1; fi
              done
              bibtex pxEND.bibtex.test > bibtex.log 2>&1
              pdflatex -halt-on-error -interaction=nonstopmode pxEND.bibtex.test.tex > bibtex.post.log 2>&1
              pdflatex -halt-on-error -interaction=nonstopmode pxEND.bibtex.test.tex >> bibtex.post.log 2>&1
              biber pxEND.biblatex.test > biber.log 2>&1
              pdflatex -halt-on-error -interaction=nonstopmode pxEND.biblatex.test.tex > biblatex.post.log 2>&1
              pdflatex -halt-on-error -interaction=nonstopmode pxEND.biblatex.test.tex >> biblatex.post.log 2>&1
              makeglossaries pxGLS.external.test > glossary.index.log 2>&1
              pdflatex -halt-on-error -interaction=nonstopmode pxGLS.external.test.tex > glossary.post.log 2>&1
              pdflatex -halt-on-error -interaction=nonstopmode pxGLS.external.test.tex >> glossary.post.log 2>&1
              grep -q DEFERRED-GLOSSARY-PAC pxEND.PAC.test.txt
              grep -q MEM-ONLY-GLOSSARY-ENTRY pxEND.MEM.test.txt
              grep -q MANUAL-UNUSED pxEND.manual-all.test.txt
              grep -q endmatter2026 pxEND.bibtex.test.bbl
              grep -q endmatter2026 pxEND.biblatex.test.bbl
              grep -q UNUSED-DESCRIPTION pxGLS.external.test.txt
              echo "P3CTEX-ENDMATTER-MATRIX-PASS"
            '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: endmatter-logs-and-pdfs
          path: |
            tex/tests/pxANN.*.pdf
            tex/tests/pxGLS.*.pdf
            tex/tests/pxEND.*.pdf
            tex/tests/pxEND.*.txt
            tex/tests/*.pass3.log
          if-no-files-found: ignore
